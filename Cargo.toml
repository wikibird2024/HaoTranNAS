[workspace]
members = ["core", "server", "cli", "e2e"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hao Tran"]
license = "MIT"
publish = false

# Every dependency of every crate is listed here once. Crates pick them with
# `name = { workspace = true }`.
#
# TLS: `ring` provider only, TLS 1.3 only (no `tls12`). Never turn on rustls or
# tokio-rustls default features: they pull aws-lc-rs / aws-lc-sys (CI checks).
[workspace.dependencies]
haotrannas-core = { path = "core", default-features = false }

tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1.16", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.11"
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.22"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
rand = "0.10"

# Used as dev-dependencies only.
tempfile = "3.27"
proptest = "1.12"
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are only noise here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Restriction lints worth having: no leftovers, no stubs that panic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Hashing dominates test time in debug builds (every chunk is SHA-256'd on
# write, read-back and commit). Optimise only these crates; our own code
# stays debuggable.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
