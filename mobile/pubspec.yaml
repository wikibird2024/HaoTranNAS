name: haotrannas_mobile
description: "HaoTranNAS phone app: backs up photos and files to my own server."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Licenses checked 2026-11-18, all permissive (BSD, MIT, Apache-2.0):
# see README.md "Packages". Check the license before adding one.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  # Shared client logic (D-040).
  haotrannas_client:
    path: ../dart_client
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  sqflite: ^2.4.6
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
