# Rules for every HaoTranNAS image (D-044).
DISTRO_NAME = "HaoTranNAS Linux"
DISTRO_VERSION = "0.1"

# Only the features a headless NAS needs. "*" opts out of every other
# default feature (wifi, bluetooth, x11, wayland, audio...): a NAS uses
# wired Ethernet and has no screen.
DISTRO_FEATURES = "acl xattr ipv4 ipv6 nfs zeroconf pci usbhost seccomp vfat ext2 ldconfig"
DISTRO_FEATURES_OPTED_OUT = "*"

# systemd, because nas/systemd/haotrannas-server.service is a systemd unit.
# This also adds the "systemd" and "usrmerge" features.
INIT_MANAGER = "systemd"

# Found on the LAN as nas.local (avahi, docs/nas-ui-design.md).
hostname:pn-base-files = "nas"
