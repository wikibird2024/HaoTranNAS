# The HaoTranNAS layer: distro rules and the image (D-044).
# Board support comes from meta-raspberrypi, so there is no machine here.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "haotrannas"
BBFILE_PATTERN_haotrannas = "^${LAYERDIR}/"
BBFILE_PRIORITY_haotrannas = "9"

LAYERDEPENDS_haotrannas = "core"
LAYERSERIES_COMPAT_haotrannas = "wrynose"
