name: rust

on:
  push:
    paths: &rust_paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "core/**"
      - "server/**"
      - "cli/**"
      - "e2e/**"
      - "protocol/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths: *rust_paths

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The vectors must be exactly the generator's output: never hand-edited
      # to make a failing test pass (docs/conventions.md section 3).
      - name: Test vectors match the generator
        run: |
          python3 -I protocol/tools/gen_vectors.py
          git diff --exit-code protocol/vectors

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build binaries
        run: cargo build --workspace --bins

      - name: Test
        run: cargo test --workspace

      # TLS must use the ring provider only. aws-lc-rs / aws-lc-sys come in when
      # a rustls-family crate has its default features on.
      # The tree covers all targets and features; the step fails loudly if
      # `cargo tree` itself breaks.
      - name: No aws-lc in the dependency tree
        run: |
          cargo tree --workspace --all-features --target all --edges all --prefix none > "$RUNNER_TEMP/dependency-tree.txt"
          if grep -E '^aws-lc-(rs|sys) ' "$RUNNER_TEMP/dependency-tree.txt"; then
            echo "aws-lc found in the dependency tree" >&2
            exit 1
          fi
