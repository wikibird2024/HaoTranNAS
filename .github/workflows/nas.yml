name: nas

on:
  push:
    paths:
      - "nas/**"
      - ".github/workflows/nas.yml"
  pull_request:
    paths:
      - "nas/**"
      - ".github/workflows/nas.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck nas/scripts/*.sh nas/scripts/tests/*.sh

      - name: Dry-run tests
        run: nas/scripts/tests/run_tests.sh

      # Also part of run_tests.sh, which skips it when systemd-analyze is
      # missing. Here it must run: the runner has systemd, so a missing tool
      # fails the job. The script verifies a temp copy with ExecStart pointed
      # at /bin/true (the real binary is not on the runner) and fails on any
      # warning that names the unit (verify exits 0 on unknown keys).
      - name: Systemd unit check
        run: nas/scripts/tests/verify_systemd_unit.sh

      # nft needs root (netlink). GitHub runners have passwordless sudo, so the
      # firewall syntax is checked here; -c only checks, it loads nothing.
      - name: Firewall syntax check
        run: |
          sudo apt-get install -y nftables
          sudo nft -c -f nas/firewall/haotrannas.nft
