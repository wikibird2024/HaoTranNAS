[package]
name = "haotrannas-core"
description = "HaoTranNAS protocol library shared by server, cli and desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "haotrannas_core"

[features]
default = []
# Async frame read/write over tokio streams (io.rs).
tokio = ["dep:tokio"]
# TLS 1.3 config and self-signed identities (tls.rs). ring provider only.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:rcgen"]

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
